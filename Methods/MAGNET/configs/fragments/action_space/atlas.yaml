PROMPTS: 
  
  ACTION_SPACE:
    android-in-the-zoo: |
      Custom Action 1: PRESS_ENTER
          - purpose: Press a enter button to confirm the input, or submit the input, or start a new line of text. 
          - format: PRESS_ENTER
          - example usage: PRESS_ENTER
      
      Custom Action 2: PRESS_HOME
          - purpose: Press a home button to navigate to the home page.
          - format: PRESS_HOME
          - example usage: PRESS_HOME

      Custom Action 3: PRESS_BACK
          - purpose: Press a back button to navigate to the previous screen.
          - format: PRESS_BACK
          - example usage: PRESS_BACK

      Custom Action 4: STOP
          - purpose: Stop and set the state of the task.
          - format: STOP [task_status (SUCCESS/FAILURE)]
          - example usage: STOP [SUCCESS]

    odyssey: |
