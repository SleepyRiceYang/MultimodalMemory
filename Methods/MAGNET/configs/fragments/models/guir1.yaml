MODEL:
  NAME: "guir1"
  QWENVL_API_KEY: ""
  QWENVL_API_URL: "http://localhost:8182/v1"
  QWENVL_MODEL: GUI-R1-7B

PROMPTS:
  GUIR1_PROMPT: |
    <image>
    You are GUI-R1, a reasoning GUI Agent Assistant. In this UI screenshot <image>, I want you to continue executing the command '{user_request}', with the action history being '{history_actions}'.
    Please provide the action to perform (enumerate from ['long_press', 'click', 'press_back', 'press_enter','press_home', 'type', 'scroll', 'stop']), the point where the cursor is moved to (integer) if a click is performed, and any input text required to complete the action.
    Output the thinking process in <think> </think> tags, and the final answer in <answer> </answer> tags as follows:
    <think> ... </think> <answer>[{'action': enum['long_press', 'click', 'press_back', 'press_enter','press_home', 'type', 'scroll', 'stop'], 'point': [x, y], 'input_text': 'no input text [default]'}]</answer>
    Note:
    specific input text (no default) is necessary for actions enum['type', 'open_app', 'scroll'] 
    Example:
    [{'action': enum['press_back','press_enter','press_home','stop'], 'point': [-100, -100], 'input_text': 'no input text'}]
    [{'action': enum['click', 'long_press'], 'point': [123, 300], 'input_text': 'no input text'}]
    [{'action': enum['type'], 'point': [-100, -100], 'input_text': 'shanghai shopping mall'}]
    [{'action': enum['scroll'], 'point': [-100, -100], 'input_text': enum['up', 'left', 'right', 'down']}]
  